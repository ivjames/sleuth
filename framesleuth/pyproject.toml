[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "framesleuth"
version = "0.1.0"
description = "Extract a deduplicated PNG frame sequence from gameplay video, with OCR."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "Pillow>=10.0",
    "ImageHash>=4.3",
    "pytesseract>=0.3.10",
    "yt-dlp>=2024.1.0",
]

[project.scripts]
framesleuth = "framesleuth.cli:main"

[tool.setuptools]
packages = ["framesleuth"]
